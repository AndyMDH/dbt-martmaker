[project]
name = "dbt-martsmith"
version = "0.1.0"
description = "Draft dbt mart models from a metric requirements sheet, grounded against models that already exist in your project."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
dbt-martsmith = "dbt_martsmith.cli:main"

[project.urls]
Repository = "https://github.com/AndyMDH/dbt-martsmith"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbt_martsmith = ["templates/*.tmpl"]
