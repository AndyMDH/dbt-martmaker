[project]
name = "dbt-martmaker"
version = "0.4.0"
description = "Turn a metric requirements sheet into a draft dbt mart model, grounded against your project's own manifest."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["skills/dbt-martmaker/scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
