<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .header-bg { fill: #f6f8fa; }
    .row-a { fill: #ffffff; }
    .row-b { fill: #fbfbfc; }
    .border { stroke: #d0d7de; stroke-width: 1; }
    .header-text { font-size: 13px; font-weight: 700; fill: #1f2328; }
    .cell-text { font-size: 12px; fill: #1f2328; }
    .cell-text-muted { font-size: 12px; fill: #57606a; }
    .pill-low { fill: #eaeef2; }
    .pill-low-text { fill: #57606a; }
    .pill-medium { fill: #fff8c5; }
    .pill-medium-text { fill: #9a6700; }
    .pill-high { fill: #ffedd5; }
    .pill-high-text { fill: #c2410c; }
    .pill-label { font-size: 11px; font-weight: 700; }
  </style>

  <!-- outer border -->
  <rect x="20" y="20" width="780" height="288" fill="none" class="border" rx="6"/>

  <!-- header -->
  <rect x="20" y="20" width="780" height="32" class="header-bg" rx="6"/>
  <rect x="20" y="40" width="780" height="12" class="header-bg"/>
  <text class="header-text" x="34" y="41">metric</text>
  <text class="header-text" x="184" y="41">description</text>
  <text class="header-text" x="374" y="41">reasoning</text>
  <text class="header-text" x="694" y="41">importance</text>

  <!-- column separators -->
  <line x1="170" y1="20" x2="170" y2="308" class="border"/>
  <line x1="360" y1="20" x2="360" y2="308" class="border"/>
  <line x1="680" y1="20" x2="680" y2="308" class="border"/>

  <!-- row 1: Payment count -->
  <rect x="20" y="52" width="780" height="64" class="row-a"/>
  <line x1="20" y1="52" x2="800" y2="52" class="border"/>
  <text class="cell-text" x="34" y="88">Payment count</text>
  <text class="cell-text" x="184" y="88">Number of payments</text>
  <text class="cell-text" x="184" y="103">processed</text>
  <text class="cell-text-muted" x="374" y="88">just a count of payments</text>
  <rect x="694" y="74" width="52" height="20" rx="10" class="pill-low"/>
  <text class="pill-label pill-low-text" x="720" y="88" text-anchor="middle">low</text>

  <!-- row 2: Monthly churned users -->
  <rect x="20" y="116" width="780" height="64" class="row-b"/>
  <line x1="20" y1="116" x2="800" y2="116" class="border"/>
  <text class="cell-text" x="34" y="142">Monthly churned</text>
  <text class="cell-text" x="34" y="157">users</text>
  <text class="cell-text" x="184" y="142">Active in last 30 days</text>
  <text class="cell-text" x="184" y="157">then inactive</text>
  <text class="cell-text-muted" x="374" y="142">stopped logging in over the last</text>
  <text class="cell-text-muted" x="374" y="157">month, based on our login/</text>
  <text class="cell-text-muted" x="374" y="172">activity data</text>
  <rect x="688" y="138" width="64" height="20" rx="10" class="pill-high"/>
  <text class="pill-label pill-high-text" x="720" y="152" text-anchor="middle">high</text>

  <!-- row 3: Revenue lost to churn -->
  <rect x="20" y="180" width="780" height="64" class="row-a"/>
  <line x1="20" y1="180" x2="800" y2="180" class="border"/>
  <text class="cell-text" x="34" y="206">Revenue lost to</text>
  <text class="cell-text" x="34" y="221">churn</text>
  <text class="cell-text" x="184" y="206">Subscription revenue from</text>
  <text class="cell-text" x="184" y="221">users who churned this month</text>
  <text class="cell-text-muted" x="374" y="206">total subscription revenue from</text>
  <text class="cell-text-muted" x="374" y="221">people who churned this month,</text>
  <text class="cell-text-muted" x="374" y="236">using our subscriptions data</text>
  <rect x="682" y="202" width="76" height="20" rx="10" class="pill-medium"/>
  <text class="pill-label pill-medium-text" x="720" y="216" text-anchor="middle">medium</text>

  <!-- row 4: Marketing ROI -->
  <rect x="20" y="244" width="780" height="64" class="row-b"/>
  <line x1="20" y1="244" x2="800" y2="244" class="border"/>
  <text class="cell-text" x="34" y="280">Marketing ROI</text>
  <text class="cell-text" x="184" y="270">How efficient our</text>
  <text class="cell-text" x="184" y="285">marketing spend is</text>
  <text class="cell-text-muted" x="374" y="270">compare ad spend against the</text>
  <text class="cell-text-muted" x="374" y="285">revenue it brought in - probably</text>
  <text class="cell-text-muted" x="374" y="300">need spend and revenue data</text>
  <rect x="682" y="266" width="76" height="20" rx="10" class="pill-medium"/>
  <text class="pill-label pill-medium-text" x="720" y="280" text-anchor="middle">medium</text>
</svg>
