<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .final { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .pending { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .matched { fill: #dafbe1; stroke: #1a7f37; }
    .ambiguous { fill: #fff8c5; stroke: #9a6700; }
    .blocked { fill: #ffebe9; stroke: #cf222e; }
    .title { font-size: 13px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 10px; fill: #57606a; }
    .small-title { font-size: 12px; font-weight: 700; }
    .small-sub { font-size: 9px; fill: #57606a; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .note { font-size: 11px; fill: #57606a; font-style: italic; }
    .gate-note { font-size: 10px; fill: #8250df; font-weight: 700; }
  </style>

  <!-- col 1: metric sheet -->
  <rect class="box" x="15" y="85" width="135" height="70" rx="8"/>
  <text class="title" x="82" y="112" text-anchor="middle">Metric sheet</text>
  <text class="sub" x="82" y="128" text-anchor="middle">.csv — stakeholder</text>
  <text class="sub" x="82" y="140" text-anchor="middle">fills it in</text>

  <line class="arrow" x1="150" y1="120" x2="173" y2="120"/>

  <!-- col 2: ask agent -->
  <rect class="box" x="175" y="85" width="165" height="70" rx="8"/>
  <text class="title" x="257" y="108" text-anchor="middle">Ask your agent to</text>
  <text class="title" x="257" y="124" text-anchor="middle">run dbt-martmaker</text>
  <text class="sub" x="257" y="142" text-anchor="middle">grounds vs. target/manifest.json</text>

  <line class="arrow" x1="340" y1="105" x2="363" y2="46"/>
  <line class="arrow" x1="340" y1="120" x2="363" y2="120"/>
  <line class="arrow" x1="340" y1="135" x2="363" y2="194"/>

  <!-- col 3: outcomes, stacked -->
  <rect class="box matched" x="365" y="20" width="130" height="52" rx="8"/>
  <text class="small-title" x="430" y="42" text-anchor="middle" fill="#1a7f37">Matched</text>
  <text class="small-sub" x="430" y="58" text-anchor="middle">confident hit</text>

  <rect class="box ambiguous" x="365" y="94" width="130" height="52" rx="8"/>
  <text class="small-title" x="430" y="116" text-anchor="middle" fill="#9a6700">Ambiguous</text>
  <text class="small-sub" x="430" y="132" text-anchor="middle">short candidate list</text>

  <rect class="box blocked" x="365" y="168" width="130" height="52" rx="8"/>
  <text class="small-title" x="430" y="190" text-anchor="middle" fill="#cf222e">Blocked</text>
  <text class="small-sub" x="430" y="206" text-anchor="middle">nothing found</text>

  <line class="arrow" x1="495" y1="46" x2="518" y2="105"/>
  <line class="arrow" x1="495" y1="120" x2="518" y2="120"/>
  <line class="arrow" x1="495" y1="194" x2="518" y2="135"/>

  <!-- col 4: proposal (the approval gate) -->
  <rect class="box pending" x="520" y="70" width="170" height="100" rx="8"/>
  <text class="title" x="605" y="98" text-anchor="middle" fill="#8250df">proposal.md</text>
  <text class="sub" x="605" y="116" text-anchor="middle">summary table +</text>
  <text class="sub" x="605" y="128" text-anchor="middle">per-metric detail</text>
  <text class="sub" x="605" y="146" text-anchor="middle">nothing built yet</text>

  <line class="arrow" x1="690" y1="120" x2="718" y2="120"/>
  <text class="gate-note" x="704" y="105" text-anchor="middle">you</text>
  <text class="gate-note" x="704" y="145" text-anchor="middle">approve</text>

  <!-- col 5: draft files, once approved -->
  <rect class="box" x="720" y="70" width="180" height="100" rx="8"/>
  <text class="title" x="810" y="98" text-anchor="middle">draft SQL +</text>
  <text class="title" x="810" y="114" text-anchor="middle">schema.yml</text>
  <text class="sub" x="810" y="134" text-anchor="middle">tests scaled to</text>
  <text class="sub" x="810" y="146" text-anchor="middle">each metric's importance</text>

  <line class="arrow" x1="900" y1="120" x2="923" y2="120"/>

  <!-- col 6: human review -->
  <rect class="box final" x="925" y="70" width="165" height="100" rx="8"/>
  <text class="title" x="1007" y="105" text-anchor="middle" fill="#0969da">You review</text>
  <text class="title" x="1007" y="121" text-anchor="middle" fill="#0969da">&amp; promote</text>
  <text class="sub" x="1007" y="141" text-anchor="middle">into models/marts/</text>

  <text class="note" x="555" y="245" text-anchor="middle">nothing is committed or built automatically at any step</text>
</svg>
