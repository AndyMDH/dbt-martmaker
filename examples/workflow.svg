<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1640 460" width="1640" height="460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">dbt-martmaker workflow</title>
  <desc id="workflow-desc">Flowchart from a stakeholder's metric sheet through grounding against the manifest and Semantic Layer, a proposal that stops for approval, to drafted SQL and schema.yml a human reviews and promotes -- nothing is committed or built automatically at any step.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============ CONNECTORS (drawn before nodes) ============ -->

  <!-- Metric sheet -> Ask agent -->
  <path d="M 196,200 H 252" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Ask agent -> diamond -->
  <path d="M 436,200 H 440" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Diamond right vertex -> Matched (on-axis, happy path, accent) -->
  <path d="M 592,200 H 640" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Diamond bottom vertex -> Ambiguous (on-axis, straight down) -->
  <path d="M 516,248 V 292" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Ambiguous bottom -> Blocked (on-axis, straight down) -->
  <path d="M 516,348 V 364" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Matched -> merge dot (on-axis, happy path continues straight, accent) -->
  <path d="M 772,200 H 856" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Ambiguous -> merge dot (right, corridor up, into dot from below) -->
  <path d="M 586,320 H 812 Q 820,320 820,312 V 208 Q 820,200 828,200 H 856"
        fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Blocked -> merge dot (right, corridor up, into dot from below, offset from Ambiguous corridor) -->
  <path d="M 586,392 H 792 Q 800,392 800,384 V 208 Q 800,200 808,200 H 856"
        fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- merge dot -> proposal.md -->
  <path d="M 864,200 H 880" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- proposal.md -> You approve -->
  <path d="M 1060,200 H 1100" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- You approve -> draft SQL -->
  <path d="M 1190,200 H 1230" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- draft SQL -> review & promote -->
  <path d="M 1400,200 H 1440" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- 1. Metric sheet (oval / start) -->
  <rect x="20" y="168" width="176" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="108" y="196" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Metric sheet</text>
  <text x="108" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.csv — stakeholder fills it in</text>

  <!-- 2. Ask your agent (action) -->
  <rect x="252" y="168" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="344" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask your agent to run</text>
  <text x="344" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dbt-martmaker</text>

  <!-- 3. Diamond — Grounds vs. manifest -->
  <polygon points="516,152 592,200 516,248 440,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="516" y="192" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grounds vs.</text>
  <text x="516" y="206" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">manifest</text>

  <!-- annotation callout: Semantic Layer check -->
  <path d="M 460,232 Q 380,256 300,272" fill="none" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="300" cy="272" r="1.6" fill="#7a8399"/>
  <text x="300" y="288" fill="#4f5d75" font-size="8.5" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Also checks your dbt Semantic Layer —</text>
  <text x="300" y="300" fill="#4f5d75" font-size="8.5" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">an existing metric is flagged, never duplicated.</text>

  <!-- 3a. Matched (accent — focal / happy path) -->
  <rect x="640" y="172" width="132" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="706" y="196" fill="#eb6c36" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Matched</text>
  <text x="706" y="210" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">confident hit</text>

  <!-- 3b. Ambiguous -->
  <rect x="446" y="292" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="516" y="316" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ambiguous</text>
  <text x="516" y="330" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">short candidate list</text>

  <!-- 3c. Blocked -->
  <rect x="446" y="364" width="140" height="56" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
  <text x="516" y="388" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked</text>
  <text x="516" y="402" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">nothing found</text>

  <!-- merge dot -->
  <circle cx="860" cy="200" r="4" fill="#2d3142"/>

  <!-- 4. proposal.md -->
  <rect x="880" y="160" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="970" y="184" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">proposal.md</text>
  <text x="970" y="200" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">summary + per-metric detail</text>
  <text x="970" y="212" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">assertions this draft will encode</text>
  <text x="970" y="228" fill="#eb6c36" font-size="8.5" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">nothing built yet</text>

  <!-- 5. You approve (small gate) -->
  <rect x="1100" y="176" width="90" height="48" rx="24" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
  <text x="1145" y="196" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
  <text x="1145" y="210" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">approve</text>

  <!-- 6. draft SQL + schema.yml -->
  <rect x="1230" y="168" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1315" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">draft SQL + schema.yml</text>
  <text x="1315" y="206" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">tests scaled to importance,</text>
  <text x="1315" y="217" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">one metric at a time</text>

  <!-- 7. You review & promote (end) -->
  <rect x="1440" y="168" width="180" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1530" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You review &amp; promote</text>
  <text x="1530" y="208" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">into models/marts/</text>

  <!-- footer caption -->
  <text x="20" y="448" fill="#7a8399" font-size="9.5" font-style="italic" font-family="'Instrument Serif', serif">nothing is committed or built automatically at any step</text>
</svg>
