<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f6f8fa; stroke: #555; stroke-width: 1.5; }
    .title { font-size: 13px; font-weight: 600; fill: #111; }
    .sub { font-size: 11px; fill: #444; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .note { font-size: 10px; fill: #666; font-style: italic; }
  </style>

  <!-- 1: metric sheet -->
  <rect class="box" x="10" y="60" width="170" height="70" rx="6"/>
  <text class="title" x="95" y="90" text-anchor="middle">metric sheet</text>
  <text class="sub" x="95" y="108" text-anchor="middle">.csv</text>

  <!-- arrow 1->2 -->
  <line class="arrow" x1="180" y1="95" x2="218" y2="95"/>

  <!-- 2: cli run -->
  <rect class="box" x="220" y="60" width="180" height="70" rx="6"/>
  <text class="title" x="310" y="85" text-anchor="middle">dbt-martsmith run</text>
  <text class="sub" x="310" y="103" text-anchor="middle">grounds vs.</text>
  <text class="sub" x="310" y="117" text-anchor="middle">target/manifest.json</text>

  <!-- arrow 2->3 -->
  <line class="arrow" x1="400" y1="95" x2="438" y2="95"/>

  <!-- 3: proposal -->
  <rect class="box" x="440" y="60" width="180" height="70" rx="6"/>
  <text class="title" x="530" y="85" text-anchor="middle">proposal.md</text>
  <text class="sub" x="530" y="103" text-anchor="middle">matched / ambiguous /</text>
  <text class="sub" x="530" y="117" text-anchor="middle">blocked, per row</text>

  <!-- arrow 3->4 -->
  <line class="arrow" x1="620" y1="95" x2="658" y2="95"/>
  <text class="note" x="639" y="50" text-anchor="middle">matched rows</text>
  <text class="note" x="639" y="145" text-anchor="middle">only</text>

  <!-- 4: draft files -->
  <rect class="box" x="660" y="60" width="180" height="70" rx="6"/>
  <text class="title" x="750" y="85" text-anchor="middle">draft SQL +</text>
  <text class="title" x="750" y="102" text-anchor="middle">schema.yml</text>
  <text class="sub" x="750" y="118" text-anchor="middle">draft__ prefixed</text>

  <!-- arrow 4->5 -->
  <line class="arrow" x1="840" y1="95" x2="878" y2="95"/>

  <!-- 5: human review -->
  <rect class="box" x="880" y="55" width="150" height="80" rx="6"/>
  <text class="title" x="955" y="80" text-anchor="middle">you review</text>
  <text class="title" x="955" y="97" text-anchor="middle">&amp; promote</text>
  <text class="sub" x="955" y="115" text-anchor="middle">into models/marts/</text>

  <text class="note" x="520" y="20" text-anchor="middle" font-size="12">nothing is committed or built automatically at any step</text>
</svg>
