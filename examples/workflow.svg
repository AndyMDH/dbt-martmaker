<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .final { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .matched { fill: #dafbe1; stroke: #1a7f37; }
    .ambiguous { fill: #fff8c5; stroke: #9a6700; }
    .blocked { fill: #ffebe9; stroke: #cf222e; }
    .title { font-size: 13px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 10px; fill: #57606a; }
    .small-title { font-size: 12px; font-weight: 700; }
    .small-sub { font-size: 9px; fill: #57606a; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .note { font-size: 11px; fill: #57606a; font-style: italic; }
  </style>

  <!-- col 1: metric sheet -->
  <rect class="box" x="20" y="85" width="150" height="70" rx="8"/>
  <text class="title" x="95" y="112" text-anchor="middle">Metric sheet</text>
  <text class="sub" x="95" y="128" text-anchor="middle">.csv — you or your</text>
  <text class="sub" x="95" y="140" text-anchor="middle">agent fills it in</text>

  <line class="arrow" x1="170" y1="120" x2="198" y2="120"/>

  <!-- col 2: ask agent -->
  <rect class="box" x="200" y="85" width="190" height="70" rx="8"/>
  <text class="title" x="295" y="108" text-anchor="middle">Ask your agent to</text>
  <text class="title" x="295" y="124" text-anchor="middle">run dbt-martsmith</text>
  <text class="sub" x="295" y="142" text-anchor="middle">grounds vs. target/manifest.json</text>

  <line class="arrow" x1="390" y1="105" x2="418" y2="46"/>
  <line class="arrow" x1="390" y1="120" x2="418" y2="120"/>
  <line class="arrow" x1="390" y1="135" x2="418" y2="194"/>

  <!-- col 3: outcomes, stacked -->
  <rect class="box matched" x="420" y="20" width="150" height="52" rx="8"/>
  <text class="small-title" x="495" y="42" text-anchor="middle" fill="#1a7f37">Matched</text>
  <text class="small-sub" x="495" y="58" text-anchor="middle">confident hit</text>

  <rect class="box ambiguous" x="420" y="94" width="150" height="52" rx="8"/>
  <text class="small-title" x="495" y="116" text-anchor="middle" fill="#9a6700">Ambiguous</text>
  <text class="small-sub" x="495" y="132" text-anchor="middle">short candidate list</text>

  <rect class="box blocked" x="420" y="168" width="150" height="52" rx="8"/>
  <text class="small-title" x="495" y="190" text-anchor="middle" fill="#cf222e">Blocked</text>
  <text class="small-sub" x="495" y="206" text-anchor="middle">nothing found</text>

  <line class="arrow" x1="570" y1="46" x2="598" y2="105"/>
  <line class="arrow" x1="570" y1="120" x2="598" y2="120"/>
  <line class="arrow" x1="570" y1="194" x2="598" y2="135"/>

  <!-- col 4: proposal + drafts -->
  <rect class="box" x="600" y="70" width="190" height="100" rx="8"/>
  <text class="title" x="695" y="100" text-anchor="middle">proposal.md +</text>
  <text class="title" x="695" y="116" text-anchor="middle">draft SQL / schema.yml</text>
  <text class="sub" x="695" y="136" text-anchor="middle">one section per metric,</text>
  <text class="sub" x="695" y="148" text-anchor="middle">matched rows only</text>

  <line class="arrow" x1="790" y1="120" x2="818" y2="120"/>

  <!-- col 5: human review -->
  <rect class="box final" x="820" y="70" width="170" height="100" rx="8"/>
  <text class="title" x="905" y="105" text-anchor="middle" fill="#0969da">You review</text>
  <text class="title" x="905" y="121" text-anchor="middle" fill="#0969da">&amp; promote</text>
  <text class="sub" x="905" y="141" text-anchor="middle">into models/marts/</text>

  <text class="note" x="505" y="245" text-anchor="middle">nothing is committed or built automatically at any step</text>
</svg>
